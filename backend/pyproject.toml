[project]
name = "aquantlens-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic-settings",
  "redis>=5.0",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
test = [
  "pytest",
  "httpx2>=2.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
